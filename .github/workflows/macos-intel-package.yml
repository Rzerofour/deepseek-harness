# .github/workflows/macos-intel-package.yml
# 方案 B：你自己的 Intel Mac 当 self-hosted runner，原生编 x64（无 Rosetta、无冒烟超时、无需签名证书）。
#
# 一次性前置：
#   fork → Settings → Actions → Runners → "New self-hosted runner" → 选 macOS / x64，
#   在这台 Intel Mac 的终端里跑它给出的 Download + Configure 两条命令（config.sh 时给个
#   自定义标签更方便，例如 mac-x64-build，然后把下面 runs-on 换成该标签）。
# 每次构建：
#   保持 runner 目录里的 `./run.sh` 运行着，再在 Actions 里 workflow_dispatch 触发。

name: Build macOS Intel x64 DMG (self-hosted)

on:
  workflow_dispatch:
  # 自托管 runner 需常开才适合定时；要每天自动打再取消注释，并把 run.sh 设为开机自启：
  # schedule:
  #   - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted            # 有自定义标签就改成那个标签（更安全、更精准）
    steps:
      - name: Verify host is x64
        run: |
          set -e
          uname -m
          [ "$(uname -m)" = "x86_64" ] || { echo "::error::这台 runner 不是 x64（$(uname -m)），mac-x64 需要 Intel 机器"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package unsigned Intel DMG
        env:
          DSH_DESKTOP_TARGET_PLATFORM: darwin
          DSH_DESKTOP_TARGET_ARCH: x64
          DSH_TELEMETRY_DISABLED: '1'
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Locate built DMG
        id: dmg
        run: |
          DMG=$(find . -name '*.dmg' -not -path '*/node_modules/*' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::构建完成但没找到 dmg；打印兜底目录"
            find apps/desktop -maxdepth 4 \( -name '*.dmg' -o -name '*.zip' \) 2>/dev/null | head -40
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - name: Publish DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: intel-x64-${{ github.run_number }}
          name: DeepSeek Harness Intel x64 — build ${{ github.run_number }}
          files: ${{ steps.dmg.outputs.path }}
