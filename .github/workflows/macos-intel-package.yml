# .github/workflows/macos-intel-package.yml
# 放在你 fork 的 deepseek-harness 仓库里：fork → 贴此文件到 .github/workflows/ →
# Actions 界面选本 workflow → Run workflow（workflow_dispatch）→ 等跑完 → Releases 下 dmg。
#
# 原理：GitHub 免费 macos-14（arm64，自带 Rosetta）交叉编译 x64；
#       用官方自带的「无签名」脚本，不需要 Apple 开发者证书。
# 产物：未签名的 macOS Intel (x64) .dmg，发到你的 GitHub Releases。
# 注意：未签名 → 首次打开右键 → 打开（或 xattr -dr com.apple.quarantine 该 dmg）。

name: Build macOS Intel x64 DMG

on:
  workflow_dispatch:
  # 想每天自动打就把下面两行取消注释（北京时间 10:00）：
  # schedule:
  #   - cron: '0 2 * * *'

permissions:
  contents: write          # 发 Release 需要

jobs:
  build:
    runs-on: macos-15      # 免费 arm64（自带 Rosetta）交叉编 x64；macos-14 已于 2026-11-02 退役。备选：macos-26 / macos-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Rosetta (x64 交叉编译前提)
        run: arch -x86_64 /usr/bin/true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package unsigned Intel DMG
        env:
          DSH_DESKTOP_TARGET_PLATFORM: darwin
          DSH_DESKTOP_TARGET_ARCH: x64
          DSH_TELEMETRY_DISABLED: '1'
        run: pnpm run package:desktop:mac:x64:unsigned -- --defer-runtime-smoke

      - name: Locate built DMG
        id: dmg
        run: |
          DMG=$(find . -name '*.dmg' -not -path '*/node_modules/*' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::构建完成但没找到 dmg；打印兜底目录"
            find apps/desktop -maxdepth 4 \( -name '*.dmg' -o -name '*.zip' \) 2>/dev/null | head -40
            exit 1
          fi
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - name: Publish DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: intel-x64-${{ github.run_number }}
          name: DeepSeek Harness Intel x64 — build ${{ github.run_number }}
          files: ${{ steps.dmg.outputs.path }}
